name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laupay
          POSTGRES_PASSWORD: laupay
          POSTGRES_DB: laupay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://laupay:laupay@localhost:5432/laupay?schema=public
      DIRECT_URL: postgresql://laupay:laupay@localhost:5432/laupay?schema=public
      JWT_ACCESS_SECRET: ci-test-secret-not-used-in-production
      NODE_ENV: test
      VTU_PROVIDER: mock
      FULFILLMENT_MODE: provider_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: E2E tests (real Postgres — proves ledger concurrency safety)
        run: npm run test:e2e -- --ci

      - name: Build
        run: npm run build
