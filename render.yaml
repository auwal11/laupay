services:
  - type: web
    name: laupay-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_SENDER_EMAIL
        value: auwalbashar12@gmail.com
      - key: BREVO_SENDER_NAME
        value: LAUPAY
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: VTU_PROVIDER
        value: vtpass
      - key: FULFILLMENT_MODE
        value: provider_test
      - key: VTPASS_TEST_OUTCOME
        value: success
      - key: MONNIFY_BASE_URL
        value: https://sandbox.monnify.com
      - key: ADMIN_EMAIL
        value: auwalbashar12@gmail.com
      - key: ADMIN_NAME
        value: auwal
      - key: SUPER_ADMIN_EMAILS
        value: auwalbashar12@gmail.com
      - key: ADMIN_WEB_ORIGIN
        value: https://laupay.vercel.app
      - key: PUBLIC_API_BASE_URL
        value: https://laupay.vercel.app
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: SUPABASE_URL
        value: https://huaufrjegnzzyaxrvwdo.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: profile-photos
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: VTPASS_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPER_ADMIN_IDS
        sync: false
